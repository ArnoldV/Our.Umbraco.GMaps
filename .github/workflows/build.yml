name: Our.Umbraco.GMaps - CI

on:
  release:
    types: [published]
  push:
    branches:
      - master
  pull_request:

env:
  CLIENT_PROJECT: Our.Umbraco.GMaps/Client
  OUTPUT_PATH: ./build-out/

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['10.x']
        # The package ships one flavour per supported Umbraco major, built from the same commit.
        umbraco-major: ['17', '18']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Fetch all history for all tags and branches
      run: git fetch --prune --unshallow

    - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v6

      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: '${{env.CLIENT_PROJECT}}/package.json'
        cache: 'npm'
        cache-dependency-path: '${{env.CLIENT_PROJECT}}/package-lock.json'

    # build.proj owns the major-to-project mapping, so ask it rather than repeating it here.
    - name: Get Release Version
      id: package_version
      run: |
        version=$(dotnet msbuild build.proj -t:PrintVersion \
          -p:UmbracoMajors=${{ matrix.umbraco-major }} \
          -nologo -verbosity:minimal | tr -d '[:space:]')
        echo "Umbraco ${{ matrix.umbraco-major }} flavour is version $version"
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Check Version v${{ steps.package_version.outputs.version }} Pre-Release state
      id: check_prerelease
      run: |
        if [[ ${{ steps.package_version.outputs.version }} =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "Pre-Release detected"
            echo "prerelease=true" >> $GITHUB_OUTPUT
        else
            echo "Pre-Release NOT detected"
            echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    # build.sh is the single source of truth for how this package is built: it builds the
    # backoffice client bundle, then builds and packs the selected Umbraco flavour.
    - name: Build and pack
      run: ./build.sh --major ${{ matrix.umbraco-major }} --configuration Release --output ${{ env.OUTPUT_PATH }}

    - name: Publish to NuGet
      if: github.event_name == 'release'
      working-directory: ${{ env.OUTPUT_PATH }}
      run: dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }}

    # gh is preinstalled on GitHub-hosted runners. It replaces avakar/tag-and-release,
    # which is unmaintained, still runs on Node 12 and emits the removed ::set-output.
    - name: Create Release Tag v${{ steps.package_version.outputs.version }}
      if: github.event_name == 'release'
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.package_version.outputs.version }}
        PRERELEASE: ${{ steps.check_prerelease.outputs.prerelease }}
      run: |
        args=(--target "$GITHUB_SHA" --title "v$VERSION" --notes "")
        if [ "$PRERELEASE" = "true" ]; then
          args+=(--prerelease)
        fi
        gh release create "v$VERSION" "${args[@]}"
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
          --jq '"id=\(.id)\nhtml_url=\(.html_url)\nupload_url=\(.upload_url)"' >> "$GITHUB_OUTPUT"

    - name: Release information for v${{ steps.package_version.outputs.version }}
      if: github.event_name == 'release'
      run: |
        echo Release Id: ${{ steps.release.outputs.id }}
        echo Upload URL: ${{ steps.release.outputs.upload_url }}
        echo Release URL: ${{ steps.release.outputs.html_url }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-umbraco${{ matrix.umbraco-major }}
        path: ${{ env.OUTPUT_PATH }}/
