name: Our.Umbraco.GMaps - Release

on:
  push:
    branches: [ release/* ]

env:
  CLIENT_PROJECT: Our.Umbraco.GMaps/Client
  OUTPUT_PATH: ./build-out/

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['10.x']
        # The package ships one flavour per supported Umbraco major, built from the same commit.
        umbraco-major: ['17', '18']

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4

      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '${{env.CLIENT_PROJECT}}/package.json'
        cache: 'npm'
        cache-dependency-path: '${{env.CLIENT_PROJECT}}/package-lock.json'

    # build.proj owns the major-to-project mapping, so ask it rather than repeating it here.
    - name: Get Release Version
      id: package_version
      run: |
        version=$(dotnet msbuild build.proj -t:PrintVersion \
          -p:UmbracoMajors=${{ matrix.umbraco-major }} \
          -nologo -verbosity:minimal | tr -d '[:space:]')
        echo "Umbraco ${{ matrix.umbraco-major }} flavour is version $version"
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Check Version v${{ steps.package_version.outputs.version }} Pre-Release state
      id: check_prerelease
      run: |
        if [[ ${{ steps.package_version.outputs.version }} =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
          echo "Pre-Release detected"
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "Pre-Release NOT detected"
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    # build.sh is the single source of truth for how this package is built: it builds the
    # backoffice client bundle, then builds and packs the selected Umbraco flavour.
    - name: Build and pack
      run: ./build.sh --major ${{ matrix.umbraco-major }} --configuration Release --output ${{ env.OUTPUT_PATH }}

    - name: Publish to NuGet
      run: dotnet nuget push ${{ env.OUTPUT_PATH }}*.nupkg -s https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }}

    - uses: avakar/tag-and-release@v1
      name: Create Release Tag v${{ steps.package_version.outputs.version }}
      id: release
      with:
        tag_name: v${{ steps.package_version.outputs.version }}
        prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release information for v${{ steps.package_version.outputs.version }}
      run: |
        echo Release Id: ${{ steps.release.outputs.id }}
        echo Upload URL: ${{ steps.release.outputs.upload_url }}
        echo Release URL: ${{ steps.release.outputs.html_url }}
